{{- if .Values.ingress.enabled -}}
{{- $fullName := include "pia.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $blackholeName := include "pia.metricsBlackholeName" . -}}
{{- if and .Values.ingress.defaultBackend.enabled (not .Values.ingress.exposeMetrics) }}
{{- fail "ingress.defaultBackend.enabled requires ingress.exposeMetrics=true: a default backend matches whole requests rather than paths, so it would serve the app's unauthenticated /metrics for every request that matches no rule -- and with ingress.hosts empty there are no rules at all. Disable the default backend, or set ingress.exposeMetrics=true to accept the exposure." }}
{{- end }}
{{- if not .Values.ingress.exposeMetrics }}
{{- range .Values.ingress.hosts }}
{{- range .paths }}
{{- $path := .path | default "" }}
{{- if or (eq $path "/metrics") (hasPrefix "/metrics/" $path) }}
{{- fail (printf "ingress.hosts declares the path %s, which the /metrics blackhole rule already covers. The Ingress would carry two rules for it and which one wins is controller-dependent, so the app could still serve /metrics publicly. Drop the path, or set ingress.exposeMetrics=true to route it to the app deliberately." $path) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingress.annotations "kubernetes.io/ingress.class" .Values.ingress.className}}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "pia.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.defaultBackend.enabled }}
  defaultBackend:
    service:
      name: {{ $fullName }}
      port:
        number: {{ $svcPort }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- if not $.Values.ingress.exposeMetrics }}
          # Public /metrics -> endpoint-less blackhole Service (503); the app
          # serves it unauthenticated and it must stay private. Listed first,
          # and more specific than the catch-all path, so it wins the match.
          - path: /metrics
            {{- if semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion }}
            pathType: Prefix
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $blackholeName }}
                port:
                  number: {{ $svcPort }}
              {{- else }}
              serviceName: {{ $blackholeName }}
              servicePort: {{ $svcPort }}
              {{- end }}
          {{- end }}
          {{- range .paths }}
          - path: {{ .path }}
            {{- if and .pathType (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
              {{- else }}
              serviceName: {{ $fullName }}
              servicePort: {{ $svcPort }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
