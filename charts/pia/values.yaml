## PIA Configuration

replicaCount: 1

image:
  repository: ghcr.io/eclipse-csi/pia
  pullPolicy: IfNotPresent
  tag: "0.6.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

## PIA specific configuration
config:
  # Dependency Track URL
  dependencyTrackUrl: "https://dependency-track.example.com"

  # Expected audience for JWT validation
  expectedAudience: "pia-audience"

  # Dependency Track API Key (required)
  # This should be set via --set or values override for security
  dependencyTrackApiKey: ""

  # Reference an existing secret that already holds the Dependency Track API key
  # instead of storing it in this chart's secret. When set, dependencyTrackApiKey
  # above is ignored.
  dtApiExistingSecret: ""
  # Key within dtApiExistingSecret that holds the API key.
  dtApiExistingSecretKey: "PIA_DEPENDENCY_TRACK_API_KEY"

  # PostgreSQL connection string for the RUNTIME app (required).
  # This is used by the long-lived app pods, which only read from the database,
  # so this user only needs CONNECT + USAGE + SELECT. Schema changes are applied
  # by the migration job below under a separate, higher-privileged user.
  # Example: postgresql://pia_app:password@postgres.example.com:5432/pia
  # For security, set this via --set or a values override, or reference an
  # existing secret below instead.
  databaseUrl: ""

  # Reference an existing secret that already holds the database URL instead of
  # storing it in this chart's secret. When set, databaseUrl above is ignored.
  dbExistingSecret: ""
  # Key within dbExistingSecret that holds the PostgreSQL connection string.
  dbExistingSecretKey: "PIA_DATABASE_URL"

## Database migration job
# Runs "alembic upgrade head" as a Helm pre-install/pre-upgrade hook, before the
# app Deployment is rolled out. This gates the rollout on a successful migration
# and keeps schema-changing (DDL) privileges out of the long-lived app pods.
migration:
  enabled: true

  # PostgreSQL connection string for the MIGRATION user. This user needs DDL
  # privileges (CREATE/ALTER/DROP) on the schema; the simplest setup is for it
  # to own the database. Keep this separate from config.databaseUrl above.
  # Example: postgresql://pia_migrate:password@postgres.example.com:5432/pia
  databaseUrl: ""

  # Alternatively, reference an existing secret holding the migration URL
  # (recommended for the high-privilege credential — provision it out of band).
  # When set, migration.databaseUrl above is ignored.
  dbExistingSecret: ""
  dbExistingSecretKey: "PIA_DATABASE_URL"

  # Job tuning. backoffLimit caps retries; activeDeadlineSeconds fails the
  # release (instead of blocking forever) if a migration hangs.
  backoffLimit: 1
  activeDeadlineSeconds: 600

  podAnnotations: {}
  resources: {}

## One-off project authorization sync job
# Runs "pia sync <projects.yaml>", which reconciles the project authorizations in
# the database to a curated projects.yaml. Sync needs database access, which
# typically only exists inside the cluster, so it runs as a Job from the app
# image, with projects.yaml mounted from a ConfigMap this chart also renders.
#
# Unlike the migration above, a sync is NOT part of a release: it is a manual,
# reviewed operation (a full reconcile that can delete rows), so both the Job and
# the ConfigMap are off by default. Render them on demand instead, without
# touching the release:
#
#   helm template <release> eclipse-csi/pia --version <chart-version> \
#     --values <the release's values.yaml> \
#     --set sync.enabled=true \
#     --set-file sync.projects=projects.yaml \
#     --set-json 'sync.args=["--dry-run"]' \
#     --show-only templates/sync-configmap.yaml \
#     --show-only templates/sync-job.yaml | kubectl apply -f -
#
# The pia.eclipse.org repository wraps exactly that in its sync.sh.
sync:
  enabled: false

  # Contents of projects.yaml, mounted at /config/projects.yaml. Required when
  # sync.enabled is true; pass the curated file with
  # --set-file sync.projects=<path> rather than inlining it here.
  projects: ""

  # Extra arguments for "pia sync", e.g. ["--dry-run"] to only print the plan, or
  # ["--allow-db-updates-and-deletions"] to let it apply a plan that is not
  # purely additive. --dt-url is set from dtUrl below and must not be repeated.
  args: []

  # DependencyTrack base URL sync resolves project names against. Defaults to
  # config.dependencyTrackUrl minus its /api/v1/bom upload path, so sync uses the
  # same instance the app uploads to.
  dtUrl: ""

  # Image and pull policy for the sync job. Both default to the app image, which
  # ships the sync CLI and is version-locked to the database schema. Override
  # only to run a different build of the CLI.
  image: ""
  imagePullPolicy: ""

  # Existing secrets holding the sync credentials, provisioned out of band. Sync
  # writes to the database and reads from DependencyTrack and GitHub, so it needs
  # its own credentials, separate from the app's and the migration user's:
  #   dbExistingSecret        PIA_DATABASE_URL, user needs INSERT/UPDATE/DELETE
  #   dtApiExistingSecret     PIA_DEPENDENCY_TRACK_API_KEY, needs VIEW_PORTFOLIO
  #   githubExistingSecret    PIA_GITHUB_TOKEN, needs no permissions/scopes; it
  #                           only lifts the anonymous rate limit
  # Every key in each secret is exposed to the job as an environment variable.
  # Defaults: <fullname>-db-cli, <fullname>-dt-cli and <fullname>-gh.
  dbExistingSecret: ""
  dtApiExistingSecret: ""
  githubExistingSecret: ""

  # Job tuning. backoffLimit caps retries; activeDeadlineSeconds bounds a sync
  # that hangs on an unreachable database or DependencyTrack.
  backoffLimit: 1
  activeDeadlineSeconds: 600

  podAnnotations: {}
  resources: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  annotations: {}

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  defaultBackend:
    enabled: false
  hosts:
    - host: pia.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: pia-tls
  #    hosts:
  #      - pia.local

resources:
  # Resource requests are required for HPA to function properly
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Additional environment variables
extraEnvVars: []
# - name: MY_ENV_VAR
#   value: "my-value"

# Additional environment variables from ConfigMaps or Secrets
extraEnvFrom: []
# - configMapRef:
#     name: my-configmap
# - secretRef:
#     name: my-secret
