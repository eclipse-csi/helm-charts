#
# Overrides the chart name used in resource names and the app.kubernetes.io/name label.
nameOverride: ""
# Overrides the fully qualified resource name.
fullnameOverride: ""
# Name used in the immutable selector labels (Deployment spec.selector, Service spec.selector).
# Defaults to the chart name. Do not change it on an existing release: the Deployment
# selector is immutable and the Deployment would have to be deleted and recreated.
selectorNameOverride: ""

image:
  repository: us-docker.pkg.dev/k8s-infra-prow/images/ghproxy
  tag: v20251030-0e4d5be42
  pullPolicy: IfNotPresent

# -- Cache backend used by ghproxy: `redis`, `disk` or `memory`.
# `redis` shares one Redis connection across all requests; under concurrent load
# this can panic ("slice bounds out of range [:N] with capacity 4096") and leave
# the proxy hanging on the affected URLs until it is restarted.
# `disk` (default) stores the cache under persistence.mountPath and does not have this problem.
cacheBackend: disk
# -- --cache-sizeGB, disk backend only. diskv uses it to cap its in-memory layer, not the
# space used on disk: size the volume with persistence.size.
cacheSizeGB: 1

# Redis/Valkey address (only used when cacheBackend is `redis`). Leave empty to auto-derive the valkey service
# (<release>-valkey.<namespace>.svc.cluster.local:6379).
redisAddress: ""
redisUsername: ""
redisPassword: "changeme"
# -- Disk cache only. When false, ghproxy keeps one cache directory per Authorization
# header, and only deletes it if the client sends X-PROW-TOKEN-EXPIRES-AT. otterdog does
# not send it and uses GitHub App tokens that change every hour, so the volume would fill
# up. Keep true: one shared cache, which is also how the redis backend behaves.
legacyDisableDiskCachePartitionsByAuthHeader: true
throttlingTimeMs: 10
getThrottlingTimeMs: 10
logLevel: info
# Additional custom arguments (if needed)
# Example:
# extraArgs:
#   - "--custom-arg=value"
extraArgs: []

service:
  port: 8888

# -- Port for the /healthz and /healthz/ready endpoints (--health-port)
healthPort: 8081

# -- Liveness probe. It sends a request through the proxy itself (GET /rate_limit,
# which GitHub does not count against the rate limit), so the pod is restarted when
# ghproxy stops answering. A probe on the health port only would not catch that.
# Set to null to disable.
livenessProbe:
  httpGet:
    path: /rate_limit
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5

# -- Readiness probe. Set to null to disable.
readinessProbe:
  httpGet:
    path: /healthz/ready
    port: health
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

persistence:
  enabled: true
  mountPath: /cache/
  size: 5Gi
  storageClassName: ""  # leave empty for default, or set explicitly
  # -- Access modes for the PVC. ReadWriteMany lets the new pod mount the cache while the
  # old one is still running during a rolling update; it needs a storage class that
  # supports it.
  accessModes:
    - ReadWriteMany
  # -- Use an existing PVC instead of creating one; when set, no PVC is created by this chart
  existingClaim: ""
  # -- Bind to a specific, statically-provisioned PersistentVolume by name
  volumeName: ""
  # -- Label selector to match a pre-existing PersistentVolume, e.g. matchLabels
  selector: {}
  # -- Extra annotations to add to the PVC
  annotations: {}
  # -- Extra labels to add to the PVC, in addition to the chart's standard labels
  labels: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# When vault.enabled is true, the redis-password is synced from Vault via the
# Vault Secrets Operator (VSO) into the <release>-ghproxy-redis-auth Secret.
# Vault key mapping:
#   valkey_password → <release>-ghproxy-redis-auth (key: redis-password)
vault:
  # -- Enable Vault Secrets Operator (VSO) integration for the redis-password secret
  enabled: false
  # -- Vault Kubernetes auth path, e.g. auth/kubernetes-<instance>-<env>-<namespace>
  authPath: ""
  # -- Vault role for authentication, e.g. <instance>-<env>_<namespace>_role
  role: ""
  # -- Vault KV v2 secrets engine mount path, e.g. csi
  secretMount: "csi"
  # -- Full path inside the mount, e.g. otterdog/<env> → csi/data/otterdog/staging
  secretPath: "otterdog/dev"
    # -- Service account name for the Vault Kubernetes auth method (optional; defaults to "secrets-manager-sa")
  serviceAccountName: "secrets-manager-sa"
    # -- VSO operator configuration
  operator:
    # -- How often VSO syncs the secret from Vault (e.g. 30s, 1m)
    refreshAfter: "30s"
